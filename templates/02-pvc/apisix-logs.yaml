{{ if and (eq .Values.DataEase.engine_mode "enterprise") .Values.apisix.enabled }}
kind: PersistentVolumeClaim
apiVersion: v1
metadata:
  name: apisix-logs
spec:
  accessModes:
    - {{.Values.logPersistence.accessModes}}
  resources:
    requests:
      storage: {{.Values.logPersistence.size}}
  storageClassName: {{.Values.common.storageClass}}
  {{end}}