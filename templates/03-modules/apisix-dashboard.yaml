{{ if and (eq .Values.DataEase.engine_mode "enterprise") .Values.apisixdashboard.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{.Values.apisixdashboard.host}}
spec:
  replicas: {{.Values.apisixdashboard.replicas}}
  selector:
    matchLabels:
      app: {{.Values.apisixdashboard.host}}
  template:
    metadata:
      labels:
        app: {{.Values.apisixdashboard.host}}
    spec:
      containers:
        - name: {{.Values.apisixdashboard.host}}
          image: {{.Values.common.imagePrefix}}{{.Values.apisixdashboard.image}}:{{.Values.apisixdashboard.imageTag}}
          imagePullPolicy: {{.Values.common.imagePullPolicy}}
          resources:
            limits:
              cpu: {{.Values.apisixdashboard.resourceLimits.cpu}}
              memory: {{.Values.apisixdashboard.resourceLimits.memory}}
            requests:
              memory: 512Mi
              cpu: 0.4
          ports:
            - name: tcp
              containerPort: 9000
          volumeMounts:
            - mountPath: /usr/local/apisix-dashboard/conf/conf.yaml
              name: apisix-dashboard-config
              subPath: conf.yaml
      {{if ne (.Values.common.imagePullSecrets | default "nil") "nil"}}
      imagePullSecrets:
        - name: {{.Values.common.imagePullSecrets}}
      {{ end }}
      volumes:
        - name: apisix-dashboard-config
          configMap:
            name: apisix-dashboard-config
            defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard-http
  labels:
    app: {{.Values.apisixdashboard.host}}
spec:
  type: NodePort
  selector:
    app: {{.Values.apisixdashboard.host}}
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: {{.Values.apisixdashboard.nodeport_port}}
{{end}}
