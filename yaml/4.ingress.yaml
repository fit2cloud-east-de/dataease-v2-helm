apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
  name: dataease-v2
spec:
  rules:
    - host: dev2.dataease.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apisix
                port:
                  number: 9080
