apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-de-v2
spec:
  replicas: 1
  serviceName: mysql-de-v2
  selector:
    matchLabels:
      app: mysql-de-v2
  template:
    metadata:
      labels:
        app: mysql-de-v2
    spec:
      containers:
        - name: mysql-de-v2
          image: registry.cn-qingdao.aliyuncs.com/dataease/mysql:8.4.2
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 4
              memory: 8G
            requests:
              memory: 200Mi
              cpu: 0.2
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: Password123@mysql
          ports:
            - name: tcp
              containerPort: 3306
          volumeMounts:
            - mountPath: /etc/mysql/conf.d/my.cnf
              name: opt-dataease-config
              subPath: my.cnf
            - mountPath: /docker-entrypoint-initdb.d/init.sql
              name: init-mysql
              subPath: init.sql
            - mountPath: /var/lib/mysql
              name: mysql-data
      volumes:
        - configMap:
            defaultMode: 420
            name: mysql-config
          name: opt-dataease-config
        - configMap:
            defaultMode: 420
            name: mysql-config
          name: init-mysql
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-de-v2
  labels:
    app: mysql-de-v2
spec:
  clusterIP: None
  selector:
    app: mysql-de-v2
  ports:
    - name: tcp
      port: 3306
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dataease-mysql-nodeport
  labels:
    app: mysql-de-v2
spec:
  type: NodePort
  selector:
    app: mysql-de-v2
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 30037