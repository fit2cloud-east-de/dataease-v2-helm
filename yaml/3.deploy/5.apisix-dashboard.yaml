apiVersion: apps/v1
kind: Deployment
metadata:
  name: apisix-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apisix-dashboard
  template:
    metadata:
      labels:
        app: apisix-dashboard
    spec:
      containers:
        - name: apisix-dashboard
          image: registry.cn-qingdao.aliyuncs.com/dataease/apisix-dashboard:3.0.1-alpine
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: 4
              memory: 8G
            requests:
              memory: 512Mi
              cpu: 0.4
          ports:
            - name: tcp
              containerPort: 9000
          volumeMounts:
            - mountPath: /usr/local/apisix-dashboard/conf/conf.yaml
              name: apisix-dashboard-config
              subPath: conf.yaml
      volumes:
        - name: apisix-dashboard-config
          configMap:
            name: apisix-dashboard-config
            defaultMode: 420
---
apiVersion: v1
kind: Service
metadata:
  name: apisix-dashboard-http
  labels:
    app: apisix-dashboard
spec:
  type: NodePort
  selector:
    app: apisix-dashboard
  ports:
  - port: 9000
    targetPort: 9000
    nodePort: 30009